services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidetective
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: incidetective
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidetective -d incidetective"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
