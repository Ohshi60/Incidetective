name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # Fail if src/db/schema.ts changed without a matching migration.
      # generate only diffs the schema against drizzle/meta; it never
      # connects, but drizzle.config.ts requires DATABASE_URL to be set.
      - name: Check migrations match schema
        env:
          DATABASE_URL: postgresql://unused@localhost/unused
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "::error::Schema changed without a migration. Run 'npx drizzle-kit generate' and commit the result."
            exit 1
          fi

      # Integration tests start PostgreSQL via Testcontainers, using the
      # runner's Docker daemon.
      - run: npm test

  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f Dockerfile.api -t incidetective-api:ci .

      - name: Build web image
        run: docker build -f Dockerfile.web -t incidetective-web:ci .
