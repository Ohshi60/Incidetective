name: incidetective-prod

# Everything specific to one machine comes from .env (see .env.example).
# The API applies database migrations itself when it starts.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: incidetective
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: incidetective
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incidetective -d incidetective
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Set API_IMAGE to use a prebuilt image instead of building locally.
    image: ${API_IMAGE:-incidetective-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Defaults to the bundled Postgres. Set DATABASE_URL to use your own.
      DATABASE_URL: ${DATABASE_URL:-postgresql://incidetective:${POSTGRES_PASSWORD}@postgres:5432/incidetective}
      # Defaults to Ollama on the Docker host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    # Set WEB_IMAGE to use a prebuilt image instead of building locally.
    image: ${WEB_IMAGE:-incidetective-web:local}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
